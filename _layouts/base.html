<!doctype html>
{%- assign app = site.data.apps | where: "slug", page.app | first -%}
<html lang="en"{% if app %} style="--accent-l: {{ app.accent }}; --accent-d: {{ app.accent_dark }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if app and page.layout == "doc" %}{{ page.title }} · {{ app.name }}{% elsif app %}{{ app.name }}: legal{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% if app %}<link rel="icon" href="{{ '/' | append: app.slug | append: '/icon.png' | relative_url }}">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Literata:opsz,wght@7..72,400;7..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body class="{{ page.layout }}">
{{ content }}
</body>
</html>
